id: SCNG_jenny_10
name: Jenny 10 caller says no
scenarios:
  - id: SCN_jenny_10_do_not_file
    label: Caller says no, so no case is filed
    instructions: |
      PERSONA: Jamie, an Access LA rider. You speak English.
      OPENING LINE: "I left my hat on the bus. File a lost item report. Call me at 213-555-0199."
      DO, IN ORDER:
      1. Ask them to file the lost item report.
      2. If they read anything back or ask to confirm, say "No, don't file it."
      3. Stop after they acknowledge that nothing was filed.
         Do not say yes at any point.
    agent_expectations: >
      Does not create a case and does not send a text after the caller says no.
      Tells the caller that nothing was filed. Creating a case number or saying
      a text was sent is a fail.
    tags:
      feature: log_case
      case: confirmation_refused
    userdata:
      organization_id: 6aa1562861347fe1a3087d63
      agent_id: 6af703a01d07b8f78656fe4f
      livekit_agent_name: flexagent.staging
      dispatch_rule: flexagents-inbound-staging
