id: SCNG_jenny_2
name: Jenny 2 directory
scenarios:
  - id: SCN_jenny_2_lost_bag
    label: Who to call for a bag left on the bus
    instructions: |
      PERSONA: Jamie, an Access LA rider. You speak English.
      OPENING LINE: "Who do I call if I left my bag on the bus? Is that department open right now?"
      DO, IN ORDER:
      1. Ask who to call and whether that department is open right now.
      2. Stop when you hear a department, a phone number, and open or closed.
         Do not ask to file a case.
    agent_expectations: >
      Names Lost and Found, speaks the phone number returned by the directory
      tool, and says whether it is open or closed from that tool. Inventing a
      phone number or filing a case is a fail.
    tags:
      feature: find_department
    userdata:
      organization_id: 6aa1562861347fe1a3087d63
      agent_id: 6af703a01d07b8f78656fe4f
      livekit_agent_name: flexagent.staging
      dispatch_rule: flexagents-inbound-staging
